<!DOCTYPE html>
<html>
<head>
    <title>ShipmentSure Pro</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="dark">

<nav class="navbar">
    <h2>🚚 ShipmentSure Pro</h2>
    <button id="toggleTheme">🌙</button>
</nav>

<section class="hero">
    <h1>ShipmentSure Delivery Prediction</h1>
    <p>AI-powered insights for shipment reliability</p>
    <button onclick="fillSample()" class="btn">Use Sample Data</button>
</section>

<section class="predict-section">

    <h2>Enter Shipment Details</h2>

    <form id="form">

        <div class="grid">
            <input type="number" id="ID" placeholder="Shipment ID">
            
            <select id="Warehouse_block">
                <option value="" disabled selected hidden>Select Warehouse_block</option>
                <option>A</option><option>B</option><option>C</option><option>D</option><option>F</option>
            </select>

            <select id="Mode_of_Shipment">
                <option value="" disabled selected hidden>Select Mode of Shipment</option>
                <option>Flight</option><option>Road</option><option>Ship</option>
            </select>

            <input type="number" id="Customer_care_calls" placeholder="Customer Calls">
            <input type="number" id="Customer_rating" placeholder="Rating">
            <input type="number" id="Cost_of_the_Product" placeholder="Cost">
            <input type="number" id="Prior_purchases" placeholder="Prior Purchases">

            <select id="Product_importance">
                <option value="" disabled selected hidden>Select product importance</option>
                <option>low</option><option>medium</option><option>high</option>
            </select>

            <select id="Gender">
                <option value="" disabled selected hidden>Select Gender</option>
                <option value="M">M</option>
                <option value="F">F</option>
            </select>

            <input type="number" id="Discount_offered" placeholder="Discount">
            <input type="number" id="Weight_in_gms" placeholder="Weight">
        </div>

        <button type="submit">Predict 🚀</button>
    </form>

    <div id="result" class="result-box"></div>

    <div id="history" class="history"></div>

</section>
<div id="stats"></div>
<script src="/static/app.js"></script>
</body>
</html>
